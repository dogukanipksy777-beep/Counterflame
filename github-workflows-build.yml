name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Gradle
        run: |
          wget https://services.gradle.org/distributions/gradle-8.2.1-bin.zip
          unzip gradle-8.2.1-bin.zip
          echo "$PWD/gradle-8.2.1/bin" >> $GITHUB_PATH

      - name: Extract project
        run: |
          unzip CounterFlame_Black_Phone_Build.zip -d project
          find project -name settings.gradle -o -name settings.gradle.kts

      - name: Build
        run: |
          DIR=$(dirname "$(find project -name settings.gradle | head -n 1)")
          gradle -p "$DIR" assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: CounterFlame-APK
          path: project/**/build/outputs/apk/debug/*.apk
